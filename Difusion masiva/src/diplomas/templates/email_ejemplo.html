<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Plantilla de ejemplo. Los campos entre llaves dobles son columnas exactas de tus datos, sensibles a mayúsculas. -->
</head>
<body style="margin:0; padding:24px 0; background:#f4f6f8;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="max-width:640px; width:100%; background:#ffffff; border-radius:8px; font-family:Arial, Helvetica, sans-serif; color:#1e293b;">
          <tr>
            <td style="background:#0f3d5e; color:#ffffff; padding:20px 28px; border-radius:8px 8px 0 0; font-size:20px; font-weight:bold;">
              Título de tu comunicación
            </td>
          </tr>
          <tr>
            <td style="padding:24px 28px; font-size:15px; line-height:1.6;">
              <p style="margin:0 0 14px;">Estimado(a) <strong>{{nombre}}</strong><br/>
                <strong>{{entidad}}</strong><br/>
                {{municipio}}, {{departamento}}</p>
              <p style="margin:0 0 14px;">Reciba un cordial saludo. Escribe aquí el mensaje de tu campaña.</p>
              <p style="margin:0 0 14px;">Adjunto encontrará el documento correspondiente.</p>
              <p style="margin:0;">Atentamente,<br/><strong>Mi Organización</strong></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
