[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diplomas"
version = "0.2.0"
description = "Estación de difusión masiva: documentos personalizados y envío de correos"
requires-python = ">=3.10"
dependencies = [
    "python-docx",
    "pandas",
    "openpyxl",
    "typer",
    "docx2pdf",
    "pypdf",
    "streamlit",
    "python-dotenv",
]

[project.scripts]
diplomas = "diplomas.config:main_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diplomas = ["templates/*.html"]
